    <script>
      (function () {
        try {
          var ownDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!ownDesc || (ownDesc.get && !ownDesc.set && ownDesc.configurable)) {
            var proto = Object.getPrototypeOf(window);
            var origGet = ownDesc && ownDesc.get;
            var origVal = origGet ? null : window.fetch;
            var overridden = false;
            var overrideValue;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                if (overridden) return overrideValue;
                if (origGet) return origGet.call(window);
                return proto ? Reflect.get(proto, 'fetch', window) : origVal;
              },
              set: function (nextFetch) {
                overridden = true;
                overrideValue = nextFetch;
              },
            });
          }
        } catch (_err) {
          // Ignore non-configurable host descriptors
        }

        window.addEventListener(
          'error',
          function (event) {
            if (
              event &&
              typeof event.filename === 'string' &&
              event.filename.indexOf('chrome-extension://') === 0
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
